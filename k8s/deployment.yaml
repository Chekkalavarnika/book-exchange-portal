apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-exchange
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book-exchange
  template:
    metadata:
      labels:
        app: book-exchange
    spec:
      containers:
        - name: book-exchange
          image: book-exchange-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
